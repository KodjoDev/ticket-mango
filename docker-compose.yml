# Environnement de développement local : `docker compose up -d`
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
      POSTGRES_DB: ticketing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Crée aussi la base ticketing_test utilisée par les tests d'intégration.
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing"]
      interval: 5s
      retries: 10

  # Correcteur orthographique et grammatical : les textes restent sur votre infrastructure.
  languagetool:
    image: erikvl87/languagetool:6.6
    ports:
      - "8010:8010"
    environment:
      Java_Xms: 512m
      Java_Xmx: 1g

  # Boîte de test : capture les e-mails envoyés (interface sur http://localhost:8025, SMTP sur 1025).
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
